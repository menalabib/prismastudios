name: Update playlist

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the playlist
        run: python3 .github/scripts/update_playlist.py
      - name: Commit changes
        run: |
          if ! git diff --quiet -- data/playlist.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/playlist.json
            git commit -m "playlist - refresh songs"
            git push
          fi
